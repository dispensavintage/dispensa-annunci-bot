name: Posta prodotto su Telegram

on:
  # Ogni 2,5 ore dalle 8 alle 23 (ora italiana). GitHub usa UTC: orari = ora IT - 2 (estate CEST).
  # In inverno (CET) i post slittano 1h prima (7:00–22:00), comunque nella fascia diurna.
  # NB: minuti "fuori picco" (:13/:43) per ridurre i ritardi/salti di GitHub (peggiori a :00 e :30).
  schedule:
    - cron: "13 6 * * *"    # 08:13 IT
    - cron: "43 8 * * *"    # 10:43 IT
    - cron: "13 11 * * *"   # 13:13 IT
    - cron: "43 13 * * *"   # 15:43 IT
    - cron: "13 16 * * *"   # 18:13 IT
    - cron: "43 18 * * *"   # 20:43 IT
    - cron: "13 21 * * *"   # 23:13 IT
  workflow_dispatch: {}     # avvio manuale dal tab Actions

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Posta prodotto a caso su Telegram
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python telegram_poster.py
